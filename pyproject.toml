[project]
name = "multi-provider-llm-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Violet Nguyen" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.15.0",
    "fastapi>=0.146.0",
    "openai>=3.35.1",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.0",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
multi-provider-llm-gateway = "multi_provider_llm_gateway:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
